name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # application.properties가 없으므로 Spring 컨텍스트가 필요한 contextLoads는 제외한다
      - name: Unit tests
        run: ./gradlew test -PunitOnly --no-daemon
      - name: Build jar
        run: ./gradlew build -x test --no-daemon
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Front/package-lock.json
      - run: npm ci
      # tsc && vite build
      - name: Build
        run: npm run build
      # main에 기존 린트 오류가 남아 있어 정리 전까지는 결과만 보여주고 실패로 막지 않는다
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
